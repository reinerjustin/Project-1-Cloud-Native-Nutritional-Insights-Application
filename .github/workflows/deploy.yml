name: Diet Analysis CI/CD

on:
  push:
    branches:
      - main
    pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    -  name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

  - name: Install Python dependencies
    run: |
      python -m pip install --upgrade pip
      pip install pandas matplotlib seaborn azure-storage-blob

  - name: Check Python syntax
    run: |
      python -m py_compile data_analysis.py
      python -m py_compile lambda_function.py

  - name: Build Docker image
    run: |
      docker build -t diet-analysis .

   - name: Test Docker container
    run: |
      docker run --name diet-analysis-test diet-analysis

    - name: Show container output
      run: |
        docker logs diet-analysis-test

    - name: Remove test container
      run: |
        docker rm diet-analysis-test


